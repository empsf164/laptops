  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const guideId = params.get("id") || "ram-guide-2024";

      const guides = typeof NOVA_GUIDES_DATA !== "undefined" ? NOVA_GUIDES_DATA : [];
      const laptops = typeof NOVA_LAPTOPS_DATA !== "undefined" ? NOVA_LAPTOPS_DATA : [];

      const guide = guides.find((g) => g.id === guideId) || guides[0];
      document.title = `${guide.title} — NOVA LAPTOPS`;

      const articleContainer = document.getElementById("guideArticleContainer");
      if (!articleContainer) return;

      const isSaved = window.novaBookmarks ? window.novaBookmarks.isGuideSaved(guide.id) : false;

      // Find related laptops
      const relatedLaps = (guide.relatedLaptops || []).map((id) => laptops.find((l) => l.id === id)).filter(Boolean);

      articleContainer.innerHTML = `
        <!-- Breadcrumbs -->
        <nav style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-muted); margin-bottom: 2rem;">
          <a href="index.html" style="color: var(--text-secondary);">Home</a>
          <span>/</span>
          <a href="guides.html" style="color: var(--text-secondary);">Guides</a>
          <span>/</span>
          <span style="color: var(--text-primary); font-weight: 600;">${guide.category}</span>
        </nav>

        <!-- Article Header -->
        <div style="margin-bottom: 2.5rem;">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <span class="badge badge-cyan">${guide.category}</span>
            <span style="font-size: 0.8125rem; color: var(--text-muted);">${guide.readTime}</span>
          </div>

          <h1 style="font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.2; margin-bottom: 1.25rem;">
            ${guide.title}
          </h1>

          <p style="font-size: 1.25rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 2rem;">
            ${guide.excerpt}
          </p>

          <!-- Author Box & Save -->
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding: 1rem 0; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <div style="width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--accent-primary); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700;">
                ${guide.author.split(" ").map(n=>n[0]).join("")}
              </div>
              <div>
                <div style="font-weight: 700; color: var(--text-primary); font-size: 0.9375rem;">${guide.author}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">${guide.authorRole} • ${guide.publishDate}</div>
              </div>
            </div>

            <button class="btn btn-outline btn-sm ${isSaved ? "active" : ""}" data-save-guide-btn="${guide.id}">
              <i data-lucide="${isSaved ? "bookmark-check" : "bookmark"}" style="width: 16px; height: 16px;"></i>
              ${isSaved ? "Saved" : "Save Guide"}
            </button>
          </div>
        </div>

        <!-- Featured Article Hero Image -->
        <div style="width: 100%; aspect-ratio: 16/9; border-radius: var(--radius-xl); overflow: hidden; margin-bottom: 3rem; background: #000000;">
          <img src="${guide.image}" alt="${guide.title}" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <!-- Rich Editorial Content -->
        <div class="editorial-body">
          ${guide.content}
        </div>

        <!-- Featured Reference Laptops -->
        ${relatedLaps.length > 0 ? `
          <div style="margin-top: 4rem; padding-top: 2.5rem; border-top: 1px solid var(--border-subtle);">
            <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Laptops Mentioned in This Analysis</h3>
            <div class="grid grid-3">
              ${relatedLaps.map(lap => `
                <div class="laptop-card">
                  <div class="laptop-card-media">
                    <img src="${lap.image}" alt="${lap.model}" class="laptop-card-img">
                  </div>
                  <div class="laptop-card-body">
                    <div class="laptop-card-brand-row">
                      <span class="laptop-card-brand">${lap.brand}</span>
                      <span class="laptop-card-price">$${lap.price}</span>
                    </div>
                    <h4 style="font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem;"><a href="laptop-details.html?id=${lap.id}">${lap.model}</a></h4>
                    <div style="font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.75rem;">
                      ${lap.specs.processor.split("(")[0]} • ${lap.specs.ramValue}GB RAM
                    </div>
                    <a href="laptop-details.html?id=${lap.id}" class="btn btn-outline btn-sm" style="width: 100%;">View Specs</a>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        ` : ""}

        <!-- Bottom Back & Nav -->
        <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center;">
          <a href="guides.html" class="btn btn-outline btn-sm">
            <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> All Buying Guides
          </a>
          <a href="laptop-finder.html" class="btn btn-primary btn-sm">
            Find Your Match <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
          </a>
        </div>
      </article>
