<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NOVA LAPTOPS</title>
  <meta name="description" content="Request a password reset link to regain access to your Nova Laptops account and saved hardware lists.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <main class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin: 0 auto 1.25rem; text-decoration: none;">
          <div class="brand-logo-icon">
            <i data-lucide="cpu" style="width: 18px; height: 18px;"></i>
          </div>
          <span>NOVA</span>
        </a>
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Reset Password</h1>
        <p style="font-size: 0.875rem; color: var(--text-secondary);">Enter the email associated with your Nova account and we will send you a reset link.</p>
      </div>

      <div id="resetFormContainer">
        <form id="forgotPasswordForm">
          <div class="form-group">
            <label class="form-label" for="resetEmail">Email Address</label>
            <input type="email" id="resetEmail" class="form-input" placeholder="name@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Send Reset Link <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
          </button>
        </form>
      </div>

      <div id="resetSuccessContainer" style="display: none; text-align: center; padding: 1rem 0;">
        <div style="width: 48px; height: 48px; border-radius: var(--radius-full); background: var(--emerald-subtle); color: var(--emerald-accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
          <i data-lucide="check" style="width: 24px; height: 24px;"></i>
        </div>
        <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Check Your Inbox</h3>
        <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 1.5rem;">
          If an account exists for that email, we have sent instructions to reset your password.
        </p>
        <a href="login.html" class="btn btn-secondary" style="width: 100%;">Return to Login</a>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
        Remembered your password? <a href="login.html" style="color: var(--accent-primary); font-weight: 600;">Sign in</a>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/laptops-data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.lucide) window.lucide.createIcons();
      
      const form = document.getElementById("forgotPasswordForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          document.getElementById("resetFormContainer").style.display = "none";
          document.getElementById("resetSuccessContainer").style.display = "block";
          if (window.showToast) window.showToast("Reset link dispatched to your inbox", "success");
          if (window.lucide) window.lucide.createIcons();
        });
      }
    });
  </script>
</body>
</html>
